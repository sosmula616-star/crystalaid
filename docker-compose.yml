services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: crystalaid
      POSTGRES_PASSWORD: crystalaid
      POSTGRES_DB: crystalaid
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
volumes:
  pgdata:
  redisdata:
